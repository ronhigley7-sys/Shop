<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Higley Shop Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Staatliches&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --kraft:#E7DAB8;
    --kraft-dark:#D9C89C;
    --card:#F6F0DF;
    --ink:#2B2925;
    --ink-soft:#5B564C;
    --blue:#2C5F73;
    --blue-dark:#1E4351;
    --orange:#C9531F;
    --brass:#A8875B;
    --green:#4A6B4D;
    --line: rgba(43,41,37,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.15), transparent 60%),
      var(--kraft);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh;
    padding:20px 14px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  /* header */
  .board-header{
    text-align:center;
    padding:22px 10px 26px;
    position:relative;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--blue-dark);
    opacity:.75;
  }
  h1{
    font-family:'Staatliches',sans-serif;
    font-weight:400;
    font-size:44px;
    letter-spacing:.02em;
    margin:4px 0 6px;
    color:var(--ink);
    text-shadow: 1px 1px 0 rgba(255,255,255,0.35);
  }
  .subhead{
    font-size:13.5px;
    color:var(--ink-soft);
    max-width:420px;
    margin:0 auto;
    line-height:1.5;
  }

  /* identity bar */
  .identity{
    display:flex;
    align-items:center;
    gap:8px;
    justify-content:center;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .identity input{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    padding:7px 10px;
    border:1.5px dashed var(--brass);
    background:var(--card);
    border-radius:3px;
    width:150px;
    color:var(--ink);
  }
  .identity label{font-size:12px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .notif-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:6px 10px;
    border-radius:3px;
    border:1.5px solid var(--blue);
    background:transparent;
    color:var(--blue-dark);
    cursor:pointer;
  }
  .notif-btn.on{background:var(--blue);color:#fff;}

  /* new-items banner */
  .banner{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--orange);
    color:#fff;
    padding:10px 14px;
    border-radius:6px;
    font-size:13px;
    margin-bottom:16px;
    box-shadow:0 3px 0 rgba(0,0,0,0.12);
  }
  .banner button{
    background:rgba(255,255,255,0.2);
    border:none;color:#fff;
    padding:6px 10px;border-radius:4px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;cursor:pointer;
  }

  /* add form */
  .add-card{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:16px;
    margin-bottom:26px;
    box-shadow:0 2px 0 rgba(43,41,37,0.06);
  }
  .add-card summary{
    cursor:pointer;
    font-family:'Staatliches',sans-serif;
    font-size:20px;
    letter-spacing:.02em;
    color:var(--blue-dark);
    list-style:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .add-card summary::-webkit-details-marker{display:none;}
  .add-card summary:after{
    content:"+";
    font-size:22px;
    color:var(--orange);
    transition:transform .2s;
  }
  .add-card[open] summary:after{transform:rotate(45deg);}
  .add-form{margin-top:14px;display:flex;flex-direction:column;gap:10px;}
  .row2{display:flex;gap:10px;}
  .field{display:flex;flex-direction:column;gap:4px;flex:1;}
  .field label{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;}
  .field input, .field textarea, .field select{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:14px;
    padding:9px 10px;
    border:1.5px solid var(--line);
    border-radius:5px;
    background:#fff;
    color:var(--ink);
    resize:vertical;
  }
  .field textarea{min-height:56px;}
  .cat-toggle{display:flex;gap:8px;}
  .cat-btn{
    flex:1;
    padding:9px 8px;
    border-radius:5px;
    border:1.5px solid var(--line);
    background:#fff;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    cursor:pointer;
    color:var(--ink-soft);
    text-align:center;
  }
  .cat-btn.active[data-cat="wood"]{background:var(--green);border-color:var(--green);color:#fff;}
  .cat-btn.active[data-cat="print"]{background:var(--blue);border-color:var(--blue);color:#fff;}
  .submit-btn{
    margin-top:4px;
    background:var(--orange);
    color:#fff;
    border:none;
    padding:11px;
    border-radius:5px;
    font-family:'Staatliches',sans-serif;
    font-size:17px;
    letter-spacing:.03em;
    cursor:pointer;
  }
  .submit-btn:active{transform:translateY(1px);}
  .form-msg{font-size:12px;color:var(--ink-soft);min-height:14px;}

  /* filter/sort bar */
  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    padding:0 2px;
  }
  .toolbar-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;}
  .filters{display:flex;gap:6px;}
  .filter-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:5px 9px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .filter-btn.active{background:var(--ink);color:var(--kraft);border-color:var(--ink);}
  .toolbar-right{display:flex;align-items:center;gap:10px;}
  .total-cost{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}

  /* ticket cards */
  .ticket{
    position:relative;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:6px;
    padding:16px 16px 14px 22px;
    margin-bottom:14px;
    box-shadow:0 2px 0 rgba(43,41,37,0.07);
  }
  .ticket:before{
    content:"";
    position:absolute;
    left:9px;top:16px;bottom:16px;
    width:1.5px;
    background:repeating-linear-gradient(to bottom, var(--brass) 0 4px, transparent 4px 8px);
    opacity:.6;
  }
  .ticket-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .ticket-id{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    letter-spacing:.05em;
  }
  .ticket-title{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:700;
    font-size:16.5px;
    margin:2px 0 4px;
    color:var(--ink);
  }
  .ticket-cat{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:2px 7px;
    border-radius:10px;
    margin-bottom:6px;
  }
  .ticket-cat.wood{background:rgba(74,107,77,0.15);color:var(--green);}
  .ticket-cat.print{background:rgba(44,95,115,0.15);color:var(--blue-dark);}
  .ticket-notes{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.5;
    margin:4px 0 10px;
  }
  .ticket-meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    opacity:.75;
    margin-bottom:10px;
  }
  .stamp{
    position:absolute;
    top:12px;right:14px;
    font-family:'Staatliches',sans-serif;
    font-size:13px;
    letter-spacing:.06em;
    padding:3px 9px 2px;
    border:2px solid currentColor;
    border-radius:4px;
    transform:rotate(4deg);
    opacity:.9;
  }
  .stamp.asap{color:var(--orange);}
  .stamp.soon{color:var(--blue-dark);}
  .stamp.someday{color:var(--ink-soft);}
  .stamp.new{color:var(--orange);background:rgba(201,83,31,0.08);}

  .ticket-facts{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:10px;
  }
  .fact-chip{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    padding:3px 8px;
    border-radius:10px;
    background:rgba(43,41,37,0.06);
    color:var(--ink-soft);
  }
  .fact-chip.due-overdue{background:rgba(201,83,31,0.15);color:var(--orange);font-weight:600;}
  .status-pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.04em;
    padding:5px 10px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:#fff;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .status-pill[data-status="queued"]{border-color:var(--brass);color:var(--brass);}
  .status-pill[data-status="in_progress"]{border-color:var(--blue);color:var(--blue-dark);background:rgba(44,95,115,0.08);}
  .status-pill[data-status="done"]{border-color:var(--green);color:var(--green);background:rgba(74,107,77,0.1);}
  .ticket.is-done{opacity:.6;}
  .ticket.is-done .ticket-title{text-decoration:line-through;text-decoration-color:var(--green);}

  .vote-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    border-top:1px dashed var(--line);
    padding-top:10px;
  }

  /* admin progress panel */
  .admin-panel{
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .admin-panel-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--blue-dark);
    opacity:.7;
  }
  .admin-row{display:flex;gap:8px;}
  .admin-field{display:flex;flex-direction:column;gap:3px;flex:1;}
  .admin-field label{font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);}
  .admin-field input, .admin-field textarea{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:12.5px;
    padding:6px 8px;
    border:1.5px solid var(--line);
    border-radius:4px;
    background:#fff;
    color:var(--ink);
  }
  .admin-field textarea{min-height:44px;resize:vertical;}

  /* customer-facing progress readout */
  .progress-info{
    margin-top:8px;
    padding:8px 10px;
    background:rgba(44,95,115,0.06);
    border-radius:5px;
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .progress-dates{font-family:'IBM Plex Mono',monospace;font-size:11px;}
  .issue-note{
    color:var(--orange);
    font-weight:600;
  }
  .vote-buttons{display:flex;gap:5px;}
  .vote-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:6px 8px;
    border-radius:4px;
    border:1.5px solid var(--line);
    background:#fff;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .vote-btn.mine{border-color:var(--ink);color:var(--ink);font-weight:600;}
  .vote-btn[data-level="1"].mine{background:rgba(91,86,76,0.12);}
  .vote-btn[data-level="2"].mine{background:rgba(44,95,115,0.15);}
  .vote-btn[data-level="3"].mine{background:rgba(201,83,31,0.15);}
  .voters{
    font-size:11px;
    color:var(--ink-soft);
    text-align:right;
    line-height:1.4;
  }
  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    font-size:13.5px;
  }
  .empty-state .es-icon{font-family:'Staatliches',sans-serif;font-size:30px;color:var(--brass);margin-bottom:6px;}

  .footer-note{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    opacity:.65;
    margin-top:30px;
    font-family:'IBM Plex Mono',monospace;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="board-header">
    <div class="eyebrow">Shop &amp; Print Queue</div>
    <h1>Higley Shop Board</h1>
    <div class="subhead">Add a project, then rank the ones you want to see happen. Highest combined priority floats to the top.</div>
    <div class="identity">
      <label for="whoami">You are:</label>
      <input id="whoami" placeholder="your name" maxlength="24">
      <button class="notif-btn" id="notifBtn" type="button">🔔 Alerts off</button>
    </div>
  </div>

  <div class="banner" id="newBanner">
    <span id="newBannerText"></span>
    <button id="newBannerDismiss">Mark seen</button>
  </div>

  <details class="add-card" id="addCard">
    <summary>Add a project</summary>
    <div class="add-form">
      <div class="cat-toggle">
        <button type="button" class="cat-btn active" data-cat="wood">🪵 Woodworking</button>
        <button type="button" class="cat-btn" data-cat="print">🖨️ 3D Print</button>
      </div>
      <div class="field">
        <label>Title</label>
        <input id="pTitle" placeholder="e.g. Cedar planter box">
      </div>
      <div class="field">
        <label>Details (optional)</label>
        <textarea id="pNotes" placeholder="Size, materials, why it matters..."></textarea>
      </div>
      <div class="row2">
        <div class="field">
          <label>Est. Cost</label>
          <input id="pCost" type="number" min="0" step="1" placeholder="$">
        </div>
        <div class="field">
          <label>Needed By</label>
          <input id="pDue" type="date">
        </div>
      </div>
      <button class="submit-btn" id="addBtn" type="button">Add to queue</button>
      <div class="form-msg" id="formMsg"></div>
    </div>
  </details>

  <div class="toolbar">
    <span class="toolbar-label" id="countLabel">Loading queue...</span>
    <div class="toolbar-right">
      <span class="total-cost" id="totalCost"></span>
      <div class="filters">
        <button class="filter-btn cat-filter-btn active" data-filter="all">All</button>
        <button class="filter-btn cat-filter-btn" data-filter="wood">Wood</button>
        <button class="filter-btn cat-filter-btn" data-filter="print">Print</button>
        <button class="filter-btn" id="showDoneBtn" type="button">Show done</button>
      </div>
    </div>
  </div>

  <div id="ticketList"></div>

  <div class="footer-note">Shared board — everyone who opens this link sees the same queue. Alerts fire while this page is open in a browser tab.</div>
</div>

<script>
const BOARD_KEY = 'shop-board';
const VOTES_KEY = 'shop-votes';
const SUPABASE_URL = 'https://xnsdvdfceflmagfhpycw.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhuc2R2ZGZjZWZsbWFnZmhweWN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MTk1NjgsImV4cCI6MjA5NDk5NTU2OH0.UzKZQj4BLxPpH_OCwQR8LyDUeP9YlKn5UtXRFUFaYKA';

async function kvGet(key){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/shop_board_kv?key=eq.${encodeURIComponent(key)}&select=value`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  if(!res.ok) throw new Error('Supabase GET failed: ' + res.status);
  const rows = await res.json();
  return rows[0] ? rows[0].value : null;
}
async function kvSet(key, value){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/shop_board_kv`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      Prefer: 'resolution=merge-duplicates'
    },
    body: JSON.stringify({ key, value })
  });
  if(!res.ok) throw new Error('Supabase SET failed: ' + res.status);
}
const LEVELS = { 1: {label:'Someday', stamp:'someday'}, 2: {label:'Soon', stamp:'soon'}, 3: {label:'ASAP', stamp:'asap'} };

let projects = [];
let votes = {};
let currentFilter = 'all';
let currentCat = 'wood';
let notifOn = false;
let pollTimer = null;
let showDone = false;
const STATUS_ORDER = ['queued', 'in_progress', 'done'];
const STATUS_LABEL = { queued: 'Queued', in_progress: 'In Progress', done: 'Done' };

function myName(){
  return (document.getElementById('whoami').value || '').trim();
}

function seenKey(name){ return 'seen-count:' + name.toLowerCase(); }

async function loadBoard(){
  try{
    const val = await kvGet(BOARD_KEY);
    projects = val || [];
  }catch(e){ console.error('loadBoard', e); }
  try{
    const val = await kvGet(VOTES_KEY);
    votes = val || {};
  }catch(e){ console.error('loadVotes', e); }
}

async function saveBoard(){
  await kvSet(BOARD_KEY, projects);
}
async function saveVotes(){
  await kvSet(VOTES_KEY, votes);
}

function scoreFor(id){
  const v = votes[id] || {};
  const vals = Object.values(v);
  if(!vals.length) return 0;
  return vals.reduce((a,b)=>a+b,0) / vals.length;
}

function fmtDue(dateStr){
  // dateStr is yyyy-mm-dd, parse as local date to avoid tz shift
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, { month:'short', day:'numeric' });
}
function isOverdue(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d, 23, 59, 59);
  return dt.getTime() < Date.now();
}

function render(){
  const list = document.getElementById('ticketList');
  const name = myName();
  const isAdmin = name.toLowerCase() === 'ron';
  let items = projects.filter(p => currentFilter === 'all' ? true : p.category === currentFilter);
  if(!isAdmin){
    items = items.filter(p => (p.addedBy || '').toLowerCase() === name.toLowerCase());
  }
  if(!showDone) items = items.filter(p => (p.status || 'queued') !== 'done');
  items.sort((a,b) => {
    const aDone = (a.status||'queued') === 'done', bDone = (b.status||'queued') === 'done';
    if(aDone !== bDone) return aDone ? 1 : -1;
    return scoreFor(b.id) - scoreFor(a.id) || b.addedAt - a.addedAt;
  });

  document.getElementById('countLabel').textContent =
    items.length ? `${items.length} shown` : 'Queue is empty';

  const totalCost = items
    .filter(p => (p.status||'queued') !== 'done' && p.cost)
    .reduce((sum,p) => sum + Number(p.cost), 0);
  document.getElementById('totalCost').textContent = totalCost > 0 ? `~$${totalCost.toLocaleString()} in materials` : '';

  if(!items.length){
    list.innerHTML = `<div class="empty-state"><div class="es-icon">⚒</div>Nothing here yet.<br>Add the first project above.</div>`;
    return;
  }

  list.innerHTML = items.map(p => {
    const pv = votes[p.id] || {};
    const myLevel = name ? pv[name] : null;
    const avg = scoreFor(p.id);
    const status = p.status || 'queued';
    let stampHtml = '';
    if(avg > 0 && status !== 'done'){
      const rounded = Math.round(avg);
      const info = LEVELS[rounded] || LEVELS[1];
      stampHtml = `<div class="stamp ${info.stamp}">${info.label}</div>`;
    }
    const voterList = Object.entries(pv).map(([n,l]) => `${n}: ${LEVELS[l].label}`).join(' · ');
    const catLabel = p.category === 'wood' ? '🪵 Woodworking' : '🖨️ 3D Print';

    const chips = [];
    if(p.cost){ chips.push(`<span class="fact-chip">$${Number(p.cost).toLocaleString()}</span>`); }
    if(p.due){
      const overdue = isOverdue(p.due) && status !== 'done';
      chips.push(`<span class="fact-chip ${overdue?'due-overdue':''}">${overdue?'OVERDUE · ':'Needed by '}${fmtDue(p.due)}</span>`);
    }
    const chipsHtml = chips.length ? `<div class="ticket-facts">${chips.join('')}</div>` : '';

    const progressBits = [];
    if(p.startedDate) progressBits.push(`Started ${fmtDue(p.startedDate)}`);
    if(p.endedDate) progressBits.push(`Completed ${fmtDue(p.endedDate)}`);
    const progressHtml = (progressBits.length || p.issues) ? `
      <div class="progress-info">
        ${progressBits.length ? `<span class="progress-dates">${progressBits.join(' · ')}</span>` : ''}
        ${p.issues ? `<span class="issue-note">⚠ ${escapeHtml(p.issues)}</span>` : ''}
      </div>` : '';

    const adminPanelHtml = isAdmin ? `
      <div class="admin-panel">
        <div class="admin-panel-label">Status detail (you only)</div>
        <div class="admin-row">
          <div class="admin-field">
            <label>Started</label>
            <input type="date" class="started-input" value="${p.startedDate || ''}">
          </div>
          <div class="admin-field">
            <label>Completed</label>
            <input type="date" class="ended-input" value="${p.endedDate || ''}">
          </div>
        </div>
        <div class="admin-field">
          <label>Issues / notes</label>
          <textarea class="issues-input" placeholder="Anything the customer should know...">${escapeHtml(p.issues || '')}</textarea>
        </div>
      </div>` : '';

    return `
    <div class="ticket ${status==='done'?'is-done':''}" data-id="${p.id}">
      ${stampHtml}
      <div class="ticket-id">TICKET #${String(p.seq).padStart(3,'0')}</div>
      <span class="ticket-cat ${p.category}">${catLabel}</span>
      <div class="ticket-title">${escapeHtml(p.title)}</div>
      ${p.notes ? `<div class="ticket-notes">${escapeHtml(p.notes)}</div>` : ''}
      <div class="ticket-meta">Added by ${escapeHtml(p.addedBy || 'someone')} · ${timeAgo(p.addedAt)}</div>
      ${chipsHtml}
      <div class="vote-row">
        <div class="vote-buttons">
          <button class="vote-btn ${myLevel===1?'mine':''}" data-level="1">Someday</button>
          <button class="vote-btn ${myLevel===2?'mine':''}" data-level="2">Soon</button>
          <button class="vote-btn ${myLevel===3?'mine':''}" data-level="3">ASAP</button>
        </div>
        <button class="status-pill" data-status="${status}">${STATUS_LABEL[status]}</button>
      </div>
      ${voterList ? `<div class="voters">${voterList}</div>` : `<div class="voters">No votes yet</div>`}
      ${progressHtml}
      ${adminPanelHtml}
    </div>`;
  }).join('');

  list.querySelectorAll('.vote-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const n = myName();
      if(!n){ flashNameField(); return; }
      const ticket = btn.closest('.ticket');
      const id = ticket.dataset.id;
      const level = parseInt(btn.dataset.level, 10);
      if(!votes[id]) votes[id] = {};
      if(votes[id][n] === level){
        delete votes[id][n];
      } else {
        votes[id][n] = level;
      }
      await saveVotes();
      render();
    });
  });

  list.querySelectorAll('.status-pill').forEach(btn => {
    btn.addEventListener('click', async () => {
      const ticket = btn.closest('.ticket');
      const id = ticket.dataset.id;
      const proj = projects.find(p => p.id === id);
      if(!proj) return;
      const idx = STATUS_ORDER.indexOf(proj.status || 'queued');
      proj.status = STATUS_ORDER[(idx + 1) % STATUS_ORDER.length];
      await saveBoard();
      render();
    });
  });

  list.querySelectorAll('.started-input').forEach(input => {
    input.addEventListener('change', async () => {
      const ticket = input.closest('.ticket');
      const proj = projects.find(p => p.id === ticket.dataset.id);
      if(!proj) return;
      proj.startedDate = input.value || null;
      await saveBoard();
      render();
    });
  });

  list.querySelectorAll('.ended-input').forEach(input => {
    input.addEventListener('change', async () => {
      const ticket = input.closest('.ticket');
      const proj = projects.find(p => p.id === ticket.dataset.id);
      if(!proj) return;
      proj.endedDate = input.value || null;
      await saveBoard();
      render();
    });
  });

  list.querySelectorAll('.issues-input').forEach(textarea => {
    textarea.addEventListener('change', async () => {
      const ticket = textarea.closest('.ticket');
      const proj = projects.find(p => p.id === ticket.dataset.id);
      if(!proj) return;
      proj.issues = textarea.value.trim() || null;
      await saveBoard();
      render();
    });
  });
}

function flashNameField(){
  const el = document.getElementById('whoami');
  el.style.borderColor = 'var(--orange)';
  el.placeholder = 'enter your name first';
  el.focus();
  setTimeout(() => el.style.borderColor = '', 1200);
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function timeAgo(ts){
  const s = Math.floor((Date.now() - ts) / 1000);
  if(s < 60) return 'just now';
  if(s < 3600) return Math.floor(s/60) + 'm ago';
  if(s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

// --- Add project ---
document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
  });
});

document.getElementById('addBtn').addEventListener('click', async () => {
  const name = myName();
  const title = document.getElementById('pTitle').value.trim();
  const notes = document.getElementById('pNotes').value.trim();
  const msg = document.getElementById('formMsg');
  if(!name){ flashNameField(); msg.textContent = 'Enter your name up top first.'; return; }
  if(!title){ msg.textContent = 'Give the project a title.'; return; }

  const costVal = document.getElementById('pCost').value;
  const dueVal = document.getElementById('pDue').value;

  try{
    await loadBoard(); // pull latest before writing to avoid clobbering others
    const seq = (projects.reduce((m,p)=>Math.max(m,p.seq||0),0)) + 1;
    const project = {
      id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      seq, title, notes,
      category: currentCat,
      addedBy: name,
      addedAt: Date.now(),
      cost: costVal ? Number(costVal) : null,
      due: dueVal || null,
      status: 'queued'
    };
    projects.push(project);
    await saveBoard();
    document.getElementById('pTitle').value = '';
    document.getElementById('pNotes').value = '';
    document.getElementById('pCost').value = '';
    document.getElementById('pDue').value = '';
    msg.textContent = 'Added to the queue.';
    document.getElementById('addCard').removeAttribute('open');
    await markSeen();
    render();
    setTimeout(() => msg.textContent = '', 2500);
  }catch(e){
    console.error('add project failed', e);
    msg.textContent = 'Save failed — check connection and try again.';
  }
});

// --- Filters ---
document.querySelectorAll('.cat-filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

document.getElementById('showDoneBtn').addEventListener('click', () => {
  showDone = !showDone;
  document.getElementById('showDoneBtn').classList.toggle('active', showDone);
  render();
});

// --- Identity persistence (per-device, personal) ---
async function loadIdentity(){
  try{
    const n = localStorage.getItem('shop-my-name');
    if(n) document.getElementById('whoami').value = n;
  }catch(e){}
}
document.getElementById('whoami').addEventListener('change', async () => {
  const n = myName();
  if(n){
    try{ localStorage.setItem('shop-my-name', n); }catch(e){}
    await checkForNew();
    render();
  }
});

// --- New-project detection & alerts ---
async function markSeen(){
  const n = myName();
  if(!n) return;
  try{
    localStorage.setItem(seenKey(n), String(projects.length));
  }catch(e){}
  document.getElementById('newBanner').style.display = 'none';
}

async function checkForNew(){
  const n = myName();
  if(!n) return;
  await loadBoard();
  let seenCount = 0;
  try{
    const v = localStorage.getItem(seenKey(n));
    seenCount = v !== null ? parseInt(v, 10) : 0;
  }catch(e){ seenCount = projects.length; } // first run: don't alert on existing backlog

  const newOnes = projects.slice(seenCount).filter(p => p.addedBy !== n);
  if(newOnes.length > 0){
    const banner = document.getElementById('newBanner');
    document.getElementById('newBannerText').textContent =
      newOnes.length === 1
        ? `${newOnes[0].addedBy} added "${newOnes[0].title}"`
        : `${newOnes.length} new projects added`;
    banner.style.display = 'flex';

    if(notifOn && Notification.permission === 'granted'){
      const body = newOnes.length === 1
        ? `${newOnes[0].addedBy} added: ${newOnes[0].title}`
        : `${newOnes.length} new projects on the shop board`;
      new Notification('Higley Shop Board', { body });
    }
  } else if(seenCount === 0 && projects.length > 0){
    // first time this name is seen, silently baseline without alert
    await markSeen();
  }
  render();
}

document.getElementById('newBannerDismiss').addEventListener('click', markSeen);

// --- Browser notifications toggle ---
const notifBtn = document.getElementById('notifBtn');
notifBtn.addEventListener('click', async () => {
  if(!('Notification' in window)){
    notifBtn.textContent = '🔕 Unsupported';
    return;
  }
  if(Notification.permission === 'granted'){
    notifOn = !notifOn;
    notifBtn.textContent = notifOn ? '🔔 Alerts on' : '🔔 Alerts off';
    notifBtn.classList.toggle('on', notifOn);
  } else {
    const perm = await Notification.requestPermission();
    if(perm === 'granted'){
      notifOn = true;
      notifBtn.textContent = '🔔 Alerts on';
      notifBtn.classList.add('on');
    } else {
      notifBtn.textContent = '🔕 Blocked';
    }
  }
});

// --- Poll for changes while tab is open ---
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    const prevLen = projects.length;
    await checkForNew();
  }, 20000);
}

// --- Init ---
(async function init(){
  await loadIdentity();
  await loadBoard();
  render();
  if(myName()){
    await checkForNew();
  }
  startPolling();
})();
</script>
</body>
